<!DOCTYPE html>
<html>
<head>
    <title>Test Panier Fixé</title>
    <script>
        async function testEndpoint(endpoint, data = {}) {
            console.log(`Testing: ${endpoint}`, data);
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                    credentials: 'include'  // IMPORTANT: Send cookies
                });
                
                const text = await response.text();
                console.log(`Response from ${endpoint}:`, text);
                
                // Try to parse as JSON
                try {
                    const json = JSON.parse(text);
                    return { success: true, data: json, raw: text };
                } catch (e) {
                    return { success: false, error: 'Not JSON', raw: text };
                }
            } catch (error) {
                console.error(`Error with ${endpoint}:`, error);
                return { success: false, error: error.message };
            }
        }
        
        async function runTests() {
            const results = document.getElementById('results');
            results.innerHTML = '<h3>Résultats des tests:</h3>';
            
            // Test 1: Add item 1
            results.innerHTML += '<div><strong>Test 1: Ajouter plat ID 1</strong></div>';
            const result1 = await testEndpoint('ajax/add_to_cart.php', { 
                dish_id: 1, 
                quantity: 1 
            });
            results.innerHTML += `<div>${JSON.stringify(result1, null, 2)}</div><hr>`;
            
            // Test 2: Add item 2 (should conflict)
            results.innerHTML += '<div><strong>Test 2: Ajouter plat ID 2</strong></div>';
            const result2 = await testEndpoint('ajax/add_to_cart.php', { 
                dish_id: 2, 
                quantity: 1 
            });
            results.innerHTML += `<div>${JSON.stringify(result2, null, 2)}</div><hr>`;
            
            // Test 3: Get cart count
            results.innerHTML += '<div><strong>Test 3: Compteur panier</strong></div>';
            const countResponse = await fetch('ajax/get_cart_count.php', {
                credentials: 'include'
            });
            const countText = await countResponse.text();
            results.innerHTML += `<div>${countText}</div><hr>`;
            
            // Test 4: Check session
            results.innerHTML += '<div><strong>Test 4: Session actuelle</strong></div>';
            const sessionResponse = await fetch('debug_session.php', {
                credentials: 'include'
            });
            const sessionText = await sessionResponse.text();
            results.innerHTML += `<pre>${sessionText}</pre>`;
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
    </script>
</head>
<body>
    <h1>Test Panier - Version Fixée</h1>
    <p>User ID: 4 (d'après la session)</p>
    
    <button onclick="runTests()">Lancer les tests</button>
    <button onclick="clearResults()">Effacer les résultats</button>
    
    <div id="results" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; background: #f5f5f5; font-family: monospace;"></div>
    
    <h3>Plats de test (à adapter selon votre base de données):</h3>
    <ul>
        <li>Plat ID 1: Pasta Carbonara (Restaurant ID 1)</li>
        <li>Plat ID 2: Pizza Margherita (Restaurant ID 2)</li>
    </ul>
    
    <h3>Pour tester sur une page réelle:</h3>
    <a href="menu.php?restaurant_id=1" target="_blank">Menu Restaurant 1</a><br>
    <a href="menu.php?restaurant_id=2" target="_blank">Menu Restaurant 2</a>
</body>
</html>
